name: Regenerate from OpenAPI spec
# One spec, one way. hanzoai/openapi fires `spec-update` on every hanzo.yaml
# change; this regenerates src/ and opens a PR. Never hand-edit src/*.ts —
# edit the per-service spec in hanzoai/openapi.
on:
  repository_dispatch:
    types: [spec-update]
  workflow_dispatch:

jobs:
  generate:
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate
        # scripts/generate.sh is a call site; the driver it runs lives in
        # hanzoai/openapi and needs PyYAML, which uv supplies per-invocation.
        run: ./scripts/generate.sh
        env:
          # Read token for the private hanzoai/openapi (contents:read).
          SPEC_TOKEN: ${{ secrets.SPEC_TOKEN }}
      - name: Verify it builds
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify the examples still compile
        # A regeneration that builds but breaks the six flows has changed the
        # client's surface out from under every consumer. That is exactly the
        # PR a human must look at, so it must go red rather than open quietly.
        run: npm run examples
      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: codegen/spec-update
          title: 'chore: regenerate from openapi hanzo.yaml'
          commit-message: 'chore: regenerate from openapi hanzo.yaml'
          body: Automated regeneration from hanzoai/openapi `hanzo.yaml`.
