name: Publish NPM
# Publishing = pushing a semver tag vX.Y.Z. Build then `npm publish` the root
# `hanzoai` package. Semver only, never a sha.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HANZO_NPM_TOKEN || secrets.NPM_TOKEN }}
