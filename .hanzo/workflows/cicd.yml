# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # THE PROJECTION ASKS FOR THE RELEASE. hanzoai/ci's client lane, given no
  # payload, reads hanzoai/cloud's newest tag off git.hanzo.ai and regenerates
  # this tree onto it. That replaces a fan-out cloud pushed at nine repos and
  # which never once reached a first step — github.com has no runner for the
  # label these callers ask for, and the forge, which does, cannot receive a
  # repository_dispatch at all. Asking needs no credential spanning six owners,
  # and a release stays green whether or not this repo is well.
  schedule:
    - cron: '19 7 * * *'
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
