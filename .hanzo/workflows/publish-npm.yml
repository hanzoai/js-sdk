name: Publish
# Publishing = pushing the tag `vX.Y.Z`. The tag names the version; package.json
# must already hold it, and the receipt is what registry.npmjs.org serves — not
# what `npm publish` printed.
#
# THE DIRECTORY WAS THE WHOLE PROBLEM, not the label. This file sat in
# `.github/workflows`, and the forge collects the FIRST of its workflow
# directories that exists in the pushed commit and ignores the rest — this repo
# has `.hanzo/workflows`, so git.hanzo.ai's own listing showed exactly one
# workflow here, cicd.yml, and this one was not a job that queued, it was a job
# that did not exist. The tag that publishes is cut on the forge, so nothing
# could ever fire it.
#
# The earlier note here blamed `ubuntu-latest` and cancelled queues. That label
# is off the forge pool, so it would also have failed — but only after this file
# became reachable, which it was not. Both had to change: the directory to be
# seen, the label to be run. `hanzoai` reached npm at 2.0.5 with no workflow run
# behind it at all, published by hand; npm serves it at integrity sha512-X3V17E…
# while `npm pack` on main produces sha512-q7Rbz1…, so the published tarball
# corresponds to no commit anyone can name. That is what this file ends.
#
# `npm ci`, not `npm install`: the lockfile is committed, and a release that
# silently resolves a different axios than the gate did is not the thing that
# was gated.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  # Never cancel a publish. npm does not take a version back, so a cancelled run
  # is indistinguishable from one that half happened.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: The tag and package.json must agree
        id: what
        # A tag that names a version package.json does not hold would publish
        # something other than what it says. workflow_dispatch has no tag, so
        # there the manifest is the version.
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            [ "$TAG_VERSION" = "$VERSION" ] || {
              echo "::error::tag says $TAG_VERSION, package.json says $VERSION"; exit 1; }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Pack
        id: pack
        # `npm pack` is byte-reproducible — it normalises mtimes — so the tarball
        # digest is a stable identity for "this tree at this version", which is
        # what makes the check below mean something.
        run: |
          set -euo pipefail
          echo "integrity=$(npm pack --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].integrity')" >> "$GITHUB_OUTPUT"

      - name: Already published?
        id: exists
        # Idempotence, stated as a rule: a version that exists with OUR digest is
        # success — re-running the same tag is a no-op, which is what makes a
        # stopped release resumable. A version that exists with a DIFFERENT digest
        # is a hard failure, because someone published out of band and the tag no
        # longer describes what a consumer installs.
        run: |
          set -euo pipefail
          VERSION='${{ steps.what.outputs.version }}'
          OURS='${{ steps.pack.outputs.integrity }}'
          THEIRS="$(npm view "hanzoai@$VERSION" dist.integrity 2>/dev/null || true)"
          if [ -z "$THEIRS" ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"
          elif [ "$THEIRS" = "$OURS" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "hanzoai $VERSION is already on npm with this exact digest — nothing to do"
          else
            echo "::error::hanzoai $VERSION is on npm at $THEIRS, but this tag packs $OURS"
            exit 1
          fi

      # The npm credential comes from KMS, like every other publish credential in
      # the fleet. Only the KMS machine identity lives as a forge secret; a raw
      # NPM_TOKEN beside it would be a second place to hold one thing, and the
      # one that rots silently — npm answers an unauthorised publish with 404 on
      # PUT, not 401, so a stale token reads as "package not found" for a package
      # that plainly exists. Path: org `hanzo`, env `prod`, `js-sdk-publish`.
      - name: Load the publish credential from KMS
        if: steps.exists.outputs.done == 'false'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          # FAIL, never exit 0. A publish that skips its upload and goes green is
          # indistinguishable from one that worked — hanzoai/extension lost
          # v1.9.37 exactly that way, tagged and "successful" while npm stayed put.
          if [ -z "$KMS_CLIENT_ID" ] || [ -z "$KMS_CLIENT_SECRET" ]; then
            echo "::error::KMS machine identity absent — cannot pull the npm credential. Seed KMS_CLIENT_ID/KMS_CLIENT_SECRET as git.hanzo.ai Actions secrets (org or repo scope)." >&2
            exit 1
          fi
          KMS=https://kms.hanzo.ai; ORG=hanzo; ENVN=prod; P=js-sdk-publish
          TOKEN=$(curl -sf "$KMS/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" | jq -r .accessToken)
          [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "::error::KMS login failed"; exit 1; }
          # `|| true` on the fetch, deliberately: under `bash -e -o pipefail` a
          # `curl -sf` on an ABSENT path exits 22 and kills the step before any
          # message of ours prints, which reads like a broken network and is
          # actually an unseeded path. Capture the status and say which it was.
          BODY=$(curl -s -w '\n%{http_code}' "$KMS/v1/kms/orgs/$ORG/secrets/$P/NPM_TOKEN?env=$ENVN" \
            -H "Authorization: Bearer $TOKEN") || true
          CODE=$(printf '%s' "$BODY" | tail -1)
          VAL=$(printf '%s' "$BODY" | sed '$d' | jq -r '.secret.value // empty' 2>/dev/null || true)
          if [ -z "$VAL" ]; then
            echo "::error::KMS returned HTTP $CODE for $ORG/$ENVN/$P/NPM_TOKEN with no value — seed it there, not as a forge secret." >&2
            exit 1
          fi
          echo "::add-mask::$VAL"
          echo "NODE_AUTH_TOKEN=$VAL" >> "$GITHUB_ENV"

      - name: Publish
        if: steps.exists.outputs.done == 'false'
        run: npm publish --access public

      - name: Prove it from outside
        run: |
          set -euo pipefail
          VERSION='${{ steps.what.outputs.version }}'
          for _ in $(seq 1 30); do
            THEIRS="$(npm view "hanzoai@$VERSION" dist.integrity 2>/dev/null || true)"
            if [ "$THEIRS" = '${{ steps.pack.outputs.integrity }}' ]; then
              echo "npm serves hanzoai $VERSION at $THEIRS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm never served hanzoai $VERSION with our digest"
          exit 1
